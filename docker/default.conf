server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # 跨设备同步服务：同容器内的 127.0.0.1:3000，前端同源访问 /api，无 CORS 问题。
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 头像以 base64 内联，整库快照可能较大。
        client_max_body_size 128m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # LLM 反向代理：把外部 API 服务映射到本站同源路径，绕开浏览器 CORS 限制。
    # 在 RP-Hub 设置里填 http://<本站地址>/llm/v1 即可。
    # 注意：聊天默认走流式（SSE），必须关闭缓冲，否则回复要等全部生成完才显示。
    # 【需要改】proxy_pass 指向你自己的 LLM 服务；下面只是占位示例。
    location /llm/ {
        proxy_pass http://192.168.1.10:7864/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 流式输出必需
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        # 大模型首字延迟与长回复都可能很久
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 64m;
    }

    # SD 反向代理：把局域网 Forge 映射到本站同源路径，彻底绕开浏览器跨域与 CORS 限制。
    # 在 RP-Hub 设置里填 http://<本站地址>/sd 即可。
    # 【需要改】proxy_pass 指向你自己的 Forge/A1111 地址；下面只是占位示例。
    location /sd/ {
        proxy_pass http://192.168.1.10:7860/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
        proxy_connect_timeout 30s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # tools/ 与 sync-server/ 只供本地使用，不对 Web 暴露。
    location ^~ /tools/ {
        return 404;
    }
    location ^~ /sync-server/ {
        return 404;
    }

    # RP-Hub 全部资源都带 ?v=时间戳，禁用 HTML 缓存即可，静态资源可放心缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:js|css|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
